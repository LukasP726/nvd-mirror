services:
  init-data:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - nvd-data:/data
    restart: "no"
  updater:
    build:
      context: ../updater
    container_name: nvd-updater
    restart: unless-stopped
    user: "10001:10001"
    environment:
      DATA_DIR: /data
      UPDATE_INTERVAL: "21600"
    volumes:
      - nvd-data:/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    networks:
      - nvd-network
  mirror:
    image: nginx:stable-alpine
    container_name: nvd-mirror
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ../mirror/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nvd-data:/usr/share/nginx/html:ro

    networks:
      - nvd-network 

volumes:
  nvd-data:

networks:
  nvd-network:
    driver: bridge

