services:
  mirror:
    image: nginx:stable-alpine
    container_name: nvd-mirror
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ../mirror/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nvd-data:/usr/share/nginx/html:ro

    networks:
      - nvd-network 

volumes:
  nvd-data:

networks:
  nvd-network:
    driver: bridge

