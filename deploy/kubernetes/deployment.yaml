apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvd-mirror
  namespace: nvd-mirror
  labels:
    app: nvd-mirror
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nvd-mirror

  template:
    metadata:
      labels:
        app: nvd-mirror

    spec:
      initContainers:
        - name: init-data
          image: alpine:3.22
          command:
            - sh
            - -c
            - mkdir -p /data && chown -R 10001:10001 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nvd-data
              mountPath: /data

      containers:
        - name: updater
          image: nvd-updater:1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true

          env:
            - name: DATA_DIR
              value: /data
            - name: UPDATE_INTERVAL
              value: "21600"

          volumeMounts:
            - name: nvd-data
              mountPath: /data

        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          volumeMounts:
            - name: nvd-data
              mountPath: /usr/share/nginx/html
              readOnly: true

            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: nvd-data
          persistentVolumeClaim:
            claimName: nvd-data

        - name: nginx-config
          configMap:
            name: nvd-nginx-config