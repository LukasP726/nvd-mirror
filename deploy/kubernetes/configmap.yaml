apiVersion: v1
kind: ConfigMap
metadata:
  name: nvd-nginx-config
  namespace: nvd-mirror
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        autoindex off;

        location / {
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }
    }