---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - iptables
      - iproute2
      - socat
      - conntrack
      - ebtables
      - ethtool
    state: present