---
- name: Download k3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/k3s-install.sh
    mode: '0755'

- name: Install k3s server
  ansible.builtin.command:
    cmd: /usr/local/src/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: "{{ k3s_exec }}"

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Wait for Kubernetes API
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    delay: 5
    timeout: 180

- name: Verify Kubernetes node
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false
  retries: 10
  delay: 6
  until: k3s_nodes.rc == 0

- name: Display Kubernetes nodes
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines