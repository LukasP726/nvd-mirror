version: "3"
services:
  iac-dev-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: iac-development-container:local
    tty:  true
    stdin_open: true
    volumes:
      - "iac-dev-container-data:/var/iac-dev-container-data"
      - "../..:/workspace"
volumes:
  iac-dev-container-data:
    external: false

